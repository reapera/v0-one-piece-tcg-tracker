<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <!-- Background -->
  <rect width="180" height="180" fill="#1a1a2e"/>

  <!-- Hat brim -->
  <ellipse cx="90" cy="62" rx="70" ry="14" fill="#E8B84B"/>
  <!-- Hat crown -->
  <path d="M38 62 C36 18 142 18 142 62" fill="#E8B84B"/>
  <!-- Hat band (red stripe) -->
  <path d="M38 62 C36 44 142 44 142 62" fill="#CC2200"/>

  <!-- Skull -->
  <ellipse cx="90" cy="120" rx="42" ry="38" fill="#F2F2F2"/>

  <!-- Eyes -->
  <circle cx="72" cy="112" r="13" fill="#111"/>
  <circle cx="108" cy="112" r="13" fill="#111"/>

  <!-- Nose -->
  <path d="M82 130 L90 140 L98 130" stroke="#111" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Jaw -->
  <path d="M52 148 Q52 170 90 170 Q128 170 128 148" fill="#F2F2F2"/>

  <!-- Teeth dividers -->
  <line x1="72" y1="148" x2="72" y2="167" stroke="#111" stroke-width="3" stroke-linecap="round"/>
  <line x1="90" y1="148" x2="90" y2="170" stroke="#111" stroke-width="3" stroke-linecap="round"/>
  <line x1="108" y1="148" x2="108" y2="167" stroke="#111" stroke-width="3" stroke-linecap="round"/>
</svg>
